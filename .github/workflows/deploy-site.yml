name: Deploy Site

# 纯静态渲染部署：本地已准备好 data/parsed/*.json 与 data/index.json，
# 这里只执行 `python main.py --build-only` 渲染 dist/ 并部署到 GitHub Pages。
# 不运行任何采集、LLM 解析等后端逻辑。

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'main.py'
      - 'requirements-build.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        # 只装渲染静态站所需的最小依赖，不装后端采集/LLM 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build static site
        # 只读 data/parsed/ 与 data/index.json，纯本地渲染，秒级完成
        run: python main.py --build-only

      - name: Verify artifacts
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/.nojekyll dist/search-index.json; do
            test -e "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "产物完整，文章页 $(ls -1 dist/articles | wc -l) 篇"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库 Pages 尚未启用时，GET /pages 会返回 404。
          # enablement: true 会创建 Pages 站点并设为 GitHub Actions 源。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
