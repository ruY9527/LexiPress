name: Deploy Site

# 本地改 UI / 模板 / 新增解析文章后，push 即秒级重建并发布，不调用 LLM、不抓取。
# 跳过 daily-publish.yml 的 [skip ci] 提交，避免循环触发。

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    # 跳过 daily-publish 自动回写的提交（它们已经在本流程内完成部署）
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        # 只读 data/parsed/ 与 data/index.json，纯本地渲染，秒级完成
        run: python main.py --build-only

      - name: Verify artifacts
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/.nojekyll dist/search-index.json; do
            test -e "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "产物完整，文章页 $(ls -1 dist/articles | wc -l) 篇"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
