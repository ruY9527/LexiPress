name: Deploy Site

# 纯静态渲染部署：本地已准备好 data/parsed/*.json 与 data/index.json，
# 这里只执行 `python main.py --build-only` 渲染 dist/ 并部署到 GitHub Pages。
# 不运行任何采集、LLM 解析等后端逻辑。

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'main.py'
      - 'requirements-build.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        # 只装渲染静态站所需的最小依赖，不装后端采集/LLM 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build static site
        # 只读 data/parsed/ 与 data/index.json，纯本地渲染，秒级完成
        run: python main.py --build-only

      - name: Verify artifacts
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/.nojekyll dist/search-index.json; do
            test -e "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "产物完整，文章页 $(ls -1 dist/articles | wc -l) 篇"

      - name: Verify Pages availability
        id: pages_check
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN="${GH_PAT:-$GH_TOKEN}"
          CODE=$(curl -s -o /tmp/lp-pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "pages_api_status=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "200" ]; then
            if [ -z "$GH_PAT" ]; then
              echo "::error::仓库 GitHub Pages 尚未启用，且未提供 GH_PAT secret。"
              echo "::error::configure-pages 的 enablement 选项需要非 GITHUB_TOKEN（官方限制），因此无法用默认 token 自动启用。"
              echo "::error::请二选一："
              echo "::error::  [推荐·30秒] 打开 https://github.com/${{ github.repository }}/settings/pages ，"
              echo "::error::    将 Build and deployment → Source 设为 GitHub Actions，然后重新运行本 workflow。"
              echo "::error::  [全自动] 创建 fine-grained PAT（Administration: read-write + Pages: read-write），"
              echo "::error::    添加为仓库 secret GH_PAT，本 workflow 即会自动启用 Pages。"
              exit 1
            fi
            echo "Pages 尚未启用；检测到 GH_PAT，将由 configure-pages(enablement) 自动创建。"
          else
            echo "Pages 已启用，状态正常。"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # enablement 只能用非 GITHUB_TOKEN：有 GH_PAT 时开启自动启用，否则依赖已存在的 Pages 配置。
          enablement: ${{ secrets.GH_PAT != '' }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
