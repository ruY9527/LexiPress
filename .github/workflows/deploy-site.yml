name: Deploy Site

# 纯静态渲染部署：本地已准备好 data/parsed/*.json 与 data/index.json，
# 这里只执行 `python main.py --build-only` 渲染 dist/ 并部署到 GitHub Pages。
# 不运行任何采集、LLM 解析等后端逻辑。

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'main.py'
      - 'requirements-build.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # configure-pages 的 enablement 会调用 createPagesSite({build_type:'workflow'})
  # 首次创建 Pages 站点需要 administration:write
  administration: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build static site
        run: python main.py --build-only

      - name: Verify artifacts
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/.nojekyll dist/search-index.json; do
            test -e "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "产物完整，文章页 $(ls -1 dist/articles | wc -l) 篇"

      - name: Ensure Pages site exists
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          CODE=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/pages")
          echo "get_pages_status=$CODE"
          if [ "$CODE" = "404" ]; then
            echo "Pages 站点不存在，尝试以 GitHub Actions 为源创建..."
            CREATE_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GH_REPO/pages")
            echo "create_pages_status=$CREATE_CODE"
            cat /tmp/create.json
            if [ "$CREATE_CODE" != "201" ] && [ "$CREATE_CODE" != "204" ]; then
              echo "::error::无法自动创建 Pages 站点（HTTP $CREATE_CODE）。"
              echo "::error::请在 https://github.com/$GH_REPO/settings/pages 将 Source 设为 GitHub Actions。"
              exit 1
            fi
            echo "Pages 站点创建成功。"
          elif [ "$CODE" != "200" ]; then
            echo "::error::检查 Pages 站点失败（HTTP $CODE）"
            cat /tmp/pages.json
            exit 1
          else
            echo "Pages 站点已存在。"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
