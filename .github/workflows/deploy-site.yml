name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - 'main.py'
      - 'requirements-build.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build static site
        run: python main.py --build-only

      - name: Verify artifacts
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/.nojekyll dist/search-index.json; do
            test -e "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "产物完整，文章页 $(ls -1 dist/articles | wc -l) 篇"

      - name: Ensure Pages site exists
        # 只有在提供了 GH_PAT（有 administration:write 权限）时才尝试自动创建站点。
        # 没有 PAT 时 GITHUB_TOKEN 无权创建 Pages，跳过此步，交给 configure-pages 处理
        # （若站点已启用则正常；未启用则由其给出标准提示）。
        if: ${{ secrets.GH_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          CODE=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/pages")
          echo "get_pages_status=$CODE"
          if [ "$CODE" = "404" ]; then
            echo "Pages 站点不存在，使用 GH_PAT 创建（build_type=workflow）..."
            CREATE_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GH_REPO/pages")
            echo "create_pages_status=$CREATE_CODE"
            cat /tmp/create.json
            if [ "$CREATE_CODE" != "201" ] && [ "$CREATE_CODE" != "204" ]; then
              echo "::error::GH_PAT 创建 Pages 失败（HTTP $CREATE_CODE），请检查 PAT 权限。"
              exit 1
            fi
            echo "Pages 站点创建成功。"
          else
            echo "Pages 站点检查完成（HTTP $CODE）。"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: ${{ secrets.GH_PAT != '' }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
