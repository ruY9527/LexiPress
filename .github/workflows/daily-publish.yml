name: Daily Publish

# 每日全自动：采集 → 精选 → LLM 精读解析 → 数据回写 → 构建 → 部署 GitHub Pages
# 也可在 Actions 页面点击 "Run workflow" 手动触发。

on:
  schedule:
    # 北京时间每天 07:00（UTC 前一天 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      daily_limit:
        description: '本次最多解析篇数（留空使用 config/settings.yaml）'
        required: false
        default: ''
      force_rule_only:
        description: '强制规则解析（不调用 LLM，用于排查 Key 问题）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # 允许回写 data/parsed/ 与 data/index.json
  pages: write      # 允许部署 GitHub Pages
  id-token: write   # OIDC 部署凭证

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show runtime info
        run: |
          python --version
          python - <<'PY'
          import os
          key = os.getenv("LLM_API_KEY") or ""
          print("LLM key configured:", bool(key.strip()))
          print("LLM base url:", os.getenv("LLM_BASE_URL") or "(default in settings.yaml)")
          print("LLM model:", os.getenv("LLM_MODEL") or "(default in settings.yaml)")
          PY

      - name: Run pipeline (full)
        id: pipeline
        run: |
          ARGS="--pipeline full"
          if [ -n "${{ github.event.inputs.daily_limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.daily_limit }}"
          fi
          if [ "${{ github.event.inputs.force_rule_only }}" = "true" ]; then
            ARGS="$ARGS --force-rule-only"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Verify build artifacts
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/.nojekyll dist/search-index.json \
                   dist/static/css/tokens.css dist/static/css/site.css dist/static/js/app.js; do
            if [ -e "$f" ]; then
              echo "OK   $f"
            else
              echo "MISS $f"
              exit 1
            fi
          done
          echo "--- article pages ---"
          ls -1 dist/articles | head -20

      - name: Commit content cache back to main
        # 把新增的解析缓存与索引提交回主分支，确保历史文章沉淀且不重复消耗 API。
        # [skip ci] 防止触发 deploy-site.yml 形成循环。
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json data/parsed/

          if git diff --staged --quiet; then
            echo "没有新的解析内容需要回写。"
            exit 0
          fi

          git commit -m "chore(content): daily curated issues [skip ci]"

          # 安全回写：先 rebase 拉取远端最新提交，再进行推送
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || {
            echo "rebase 失败，尝试中止并重试一次"
            git rebase --abort || true
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          }
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          MODE="规则降级（未配置 LLM_API_KEY）"
          if [ -n "${LLM_API_KEY}" ]; then MODE="LLM"; fi
          PAGES=$(ls -1 dist/articles 2>/dev/null | wc -l)
          {
            echo "## LexiPress 每日发布"
            echo ""
            echo "- 解析模式：${MODE}"
            echo "- 文章页数：${PAGES}"
            echo "- 部署状态：${{ steps.deployment.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
